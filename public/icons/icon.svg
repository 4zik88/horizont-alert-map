<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Horizont">
  <!--
    Tab favicon. Hand-authored rather than a scaled copy of the PWA PNG: at 16px the
    generated art's rings are under half a pixel wide and render as an empty square.
    One ring, a bearing line and a centre dot survive at that size.
  -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#58a6ff" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="4.6" fill="none" stroke="#58a6ff" stroke-width="1.8" opacity="0.75"/>
  <path d="M16 16 L24.4 7.6" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.4" fill="#f85149"/>
</svg>
