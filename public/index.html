<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the map reaches under the notch; the UI uses safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- origin only: the map token is in a cookie, never in the URL, so the
     origin leaks nothing — and tile servers reject unidentified referrers. -->
<meta name="referrer" content="origin">
<meta name="theme-color" content="#0d1117">
<title>Horizont</title>

<!-- SVG first for crisp tabs at any size; the PNG covers browsers that ignore it. -->
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<!-- use-credentials, or the browser fetches the manifest with credentials omitted,
     gets the same 404 a stranger gets, and the install silently fails. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horizont">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="map" aria-label="Карта повітряних цілей"></div>

<header id="bar">
  <div class="bar-main">
    <div class="bar-count">
      <span id="dot" class="dot" title="Стан джерел"></span>
      <strong id="near">—</strong><span class="unit">поруч</span>
      <span class="sep muted">·</span>
      <span id="total" class="muted">—</span><span class="unit muted">всього</span>
    </div>
    <span class="byline">Розробка — <a href="https://t.me/f0zik" target="_blank" rel="noopener noreferrer">@f0zik</a></span>
  </div>
  <div class="bar-side">
    <span id="alerts" class="muted">тривог: —</span>
    <span id="updated" class="muted">—</span>
  </div>
</header>

<div id="controls">
  <button id="locate" class="fab" aria-label="Показати моє місцезнаходження">◎</button>
  <button id="feed-toggle" class="fab" aria-label="Стрічка повідомлень">☰</button>
</div>

<section id="sheet" class="collapsed" aria-label="Стрічка повідомлень">
  <button id="grip" aria-label="Згорнути або розгорнути стрічку"><span></span></button>
  <div id="sheet-head">
    <strong>Стрічка</strong>
    <label class="radius">
      радіус
      <input id="radius" type="range" min="5" max="120" step="5" value="40">
      <output id="radius-val">40 км</output>
    </label>
    <button id="sheet-close" aria-label="Закрити стрічку">✕</button>
  </div>
  <ul id="feed"></ul>
</section>

<noscript><p class="nojs">Для карти потрібен JavaScript.</p></noscript>

<script src="/vendor/leaflet.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
